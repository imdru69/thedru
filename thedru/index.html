<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheDRU | Creative Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for translating JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neutral: { 900: '#171717', 800: '#262626' }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: black; 
            color: white; 
            cursor: none; /* Hide default cursor */
            overflow-x: hidden;
            /* REDUCED: Global text glow reduced by ~20% */
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.12);
        }
        /* Custom Animations */
        @keyframes internalPulse { 
            0%, 100% { opacity: 0.3; transform: scale(0.8); } 
            50% { opacity: 0.8; transform: scale(1.4); } 
        }
        .hover-pulse-text { transition: all 0.3s ease; } 
        .hover-pulse-text:hover { 
            animation: textGlowPulse 1.5s infinite alternate; 
            color: #e9d5ff; 
        } 
        /* REDUCED: Text hover pulse intensity */
        @keyframes textGlowPulse { 
            0% { text-shadow: 0 0 4px rgba(192, 132, 252, 0.4); } 
            100% { text-shadow: 0 0 16px rgba(192, 132, 252, 0.8), 0 0 8px rgba(255, 255, 255, 0.65); } 
        }
        .logo-transition {
            transition: opacity 1s ease-in-out;
        }

        /* --- SHARED GRADIENT ANIMATION --- */
        @keyframes flowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 1. The Gradient Text Class - FULL SPECTRUM */
        .cinematic-text-gradient {
            background: linear-gradient(
                90deg, 
                #f43f5e, /* Red-Pink */
                #fb923c, /* Orange */
                #facc15, /* Yellow */
                #4ade80, /* Green */
                #22d3ee, /* Cyan */
                #60a5fa, /* Blue */
                #a78bfa, /* Violet */
                #e879f9, /* Magenta */
                #f43f5e  /* Loop back to Red-Pink */
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: flowGradient 8s ease infinite; /* Slower for full spectrum to look smooth */
            /* REDUCED: Text gradient shadow */
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.15));
        }

        /* 2. The Nav Bar Glow Line Class - FULL SPECTRUM */
        .cinematic-nav-glow {
            position: absolute;
            top: 100%; /* Sits exactly below the header container */
            left: 0;
            width: 100%;
            height: 2px; /* Physical line height */
            background: linear-gradient(
                90deg, 
                #f43f5e, 
                #fb923c, 
                #facc15, 
                #4ade80, 
                #22d3ee, 
                #60a5fa, 
                #a78bfa, 
                #e879f9, 
                #f43f5e
            );
            background-size: 300% 300%;
            animation: flowGradient 8s ease infinite; /* Sync with text */
            z-index: 10;
            pointer-events: none; /* Allows clicking through if it overlaps content */
        }
        
        /* Removed .cinematic-nav-glow::after to eliminate the cast light bloom */

        /* --- MENU FLOATING SHAPES ANIMATION --- */
        @keyframes floatShape {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -20px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* --- APPLE LIQUID BUTTON STYLES (HERO) --- */
        .btn-apple-glow {
            position: relative;
            border-radius: 9999px; /* Pill shape */
            padding: 2px; /* This creates the border thickness */
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
            /* REDUCED: Base shadow */
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.08);
        }

        /* Diagonal Sweep Animation for Hero Button */
        .btn-apple-glow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                120deg, 
                transparent 40%, 
                #a855f7 45%, 
                #ffffff 50%, 
                #60a5fa 55%, 
                transparent 60%
            );
            background-size: 200% 200%;
            animation: cornerSweep 3.5s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes cornerSweep {
            0% { background-position: 0% 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { background-position: 100% 100%; opacity: 0; }
        }

        .btn-apple-glow-content {
            position: relative;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 9999px;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
            transition: background 0.3s ease;
        }

        .btn-apple-glow:hover {
            transform: scale(1.05);
            /* REDUCED: Hover shadow */
            box-shadow: 0 0 32px rgba(168, 85, 247, 0.3);
        }
        .btn-apple-glow:hover .btn-apple-glow-content {
            background: rgba(0, 0, 0, 0.6);
        }

        /* --- NEW MENU BUTTON STYLE (Silver Pass-Through) --- */
        .btn-menu-silver {
            position: relative;
            border-radius: 9999px;
            background: rgba(23, 23, 23, 0.6); /* Neutral 900 base */
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* The Silver Beam */
        .btn-menu-silver::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            /* Gradient for the sweep effect */
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.6), /* Silver Core */
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: skewX(-20deg);
            pointer-events: none;
            transition: none;
            z-index: 0;
        }

        /* Trigger Animation on Hover - UPDATED: Slower and smoother */
        .btn-menu-silver:hover::before {
            animation: passThrough 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; /* Runs slowly once and stops */
        }

        .btn-menu-silver:hover {
            border-color: rgba(255, 255, 255, 0.3);
            /* REDUCED: Menu button hover glow */
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
            background: rgba(40, 40, 40, 0.8);
        }

        @keyframes passThrough {
            0% { left: -150%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 150%; opacity: 0; } /* Fades away at the end */
        }

        /* Secondary Glass Button (Hero) */
        .btn-apple-glass {
            position: relative;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .btn-apple-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            /* REDUCED: Glass button hover shadow */
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
        }
        .btn-apple-glass::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        .btn-apple-glass:hover::after {
            left: 100%;
        }

        @keyframes rotateLight {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .markdown-prose ul {
            list-style-type: disc;
            padding-left: 1.25rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .markdown-prose li {
            margin-bottom: 0.25rem;
        }
        .markdown-prose strong {
            color: #d8b4fe; /* Purple-300 */
        }
        
        /* NEW: Classy Fade Mask for Carousel */
        .mask-image-linear-fade {
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
        }

        /* NEW: Shimmer Animations for Cards */
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        @keyframes cardShimmer {
            0% { transform: translateX(-100%); }
            25% { transform: translateX(100%); } /* Takes ~3s to cross (25% of 12s) */
            100% { transform: translateX(100%); } /* Stays crossed for the remaining 9s */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---
        const Icon = ({ path }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d={path} />
            </svg>
        );
        const Instagram = ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>;
        const Mail = ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
        const ArrowRight = ({size=16, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
        const MenuIcon = ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;
        const XIcon = ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const Sparkles = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 5H5"/><path d="M19 19v4"/><path d="M23 21h-4"/></svg>;
        const Loader = ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;

        // --- CONSTANTS ---
        const INSTAGRAM_HANDLE = "drudoart";
        const INSTAGRAM_URL = "https://www.instagram.com/drudoart";
        
        // --- GEMINI API INTEGRATION ---
        const apiKey = ""; // System provides this at runtime
        
        // --- NEW: SMART IMAGE FALLBACK HELPER ---
        // This function allows the site to automatically try .jpg if .png fails, and vice versa.
        const handleSmartImageError = (e) => {
            const img = e.target;
            const src = img.src;
            
            // Check if we've already tried swapping to prevent infinite loops
            if (img.dataset.fallbackTried === "true") {
                img.style.display = 'none'; // Hide image if both formats fail
                
                // Specific text fallback for Client Logos if they fail entirely
                if (img.dataset.type === 'client-logo') {
                     img.parentElement.innerHTML = '<span style="color:#555; font-size:10px;">Logo</span>';
                }
                return;
            }

            // Mark as tried so we don't loop forever
            img.dataset.fallbackTried = "true";

            // Swap extensions logic
            if (src.toLowerCase().endsWith('.png')) {
                img.src = src.replace(/\.png$/i, '.jpg'); // Try JPG
            } else if (src.toLowerCase().endsWith('.jpg')) {
                img.src = src.replace(/\.jpg$/i, '.png'); // Try PNG
            } else if (src.toLowerCase().endsWith('.jpeg')) {
                img.src = src.replace(/\.jpeg$/i, '.png'); // Try PNG for JPEG
            }
        };

        const callGemini = async (prompt) => {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });
                
                if (!response.ok) throw new Error('API call failed');
                
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (error) {
                console.error("Gemini API Error:", error);
                return "AI Unavailable. Please try again later.";
            }
        };

        const PORTFOLIO_ITEMS = [
            { 
                id: 1, 
                title: "High-CTR Thumbnails", 
                category: "Thumbnails", 
                image: "2.png", 
                description: "Eye-catching YouTube thumbnails designed to maximize click-through rates." 
            },
            { 
                id: 2, 
                title: "Banners, Posters & Logos", 
                category: "Graphic Design", 
                image: "3.png", 
                description: "Complete visual solutions: Social media banners, event posters, and professional brand logos." 
            }
        ];

        // UPDATED: Products list with new Names, Multi-Currency Prices, and Tags
        const PRODUCTS = [
            { id: 1, name: "PREMIUM", price: "₹2000 / $30", image: "4.png", tag: "Best Seller" },
            { id: 2, name: "GOLD", price: "₹1500 / $20", image: "5.png", tag: "Most Value" },
            { id: 3, name: "STONE", price: "₹1000 / $10", image: "6.png", tag: "Starter" },
            { id: 4, name: "BULK", price: "CONTACT", image: "7.png", tag: "LIMITED" }
        ];

        // --- NEW: CLIENT DATA FOR CAROUSEL ---
        // UPDATED: Now mapped to numbered image files (9.png - 18.png)
        const CLIENTS_DATA = [
            { id: 1, name: "Apex", image: "9.png" },
            { id: 2, name: "Nexus", image: "10.png" },
            { id: 3, name: "Volt", image: "11.png" },
            { id: 4, name: "Echo", image: "12.png" },
            { id: 5, name: "Flux", image: "13.png" },
            { id: 6, name: "Orbit", image: "14.png" },
            { id: 7, name: "Spark", image: "15.png" },
            { id: 8, name: "Terra", image: "16.png" },
            { id: 9, name: "Nova", image: "17.png" },
            { id: 10, name: "Zen", image: "18.png" }
        ];

        // --- COMPONENTS ---

        // NEW: Rotating Client Carousel Component
        const ClientCarousel = () => {
            const [clients, setClients] = useState(CLIENTS_DATA);
            const [isTransitioning, setIsTransitioning] = useState(false);

            useEffect(() => {
                const interval = setInterval(() => {
                    setIsTransitioning(true);
                    setTimeout(() => {
                        setClients(prev => {
                            const newArr = [...prev];
                            const first = newArr.shift(); // Remove first
                            newArr.push(first); // Add to end
                            return newArr;
                        });
                        setIsTransitioning(false);
                    }, 600); // Slower transition duration for smoothness
                }, 3000); // Hold for 3 seconds before rotating

                return () => clearInterval(interval);
            }, []);

            // UPDATED: Show 5 clients
            const visibleClients = clients.slice(0, 5);

            return (
                <div className="w-full max-w-4xl mt-16 mx-auto"> {/* Increased top margin for better spacing */}
                     <p className="text-sm font-bold text-neutral-500 uppercase tracking-[0.2em] mb-10 text-center hover-pulse-text"> {/* Increased text size and margin */}
                        Trusted By <span className="opacity-40 normal-case tracking-normal ml-2 text-[0.8em]">(and many more)</span>
                    </p>
                    <div className="relative overflow-hidden h-24 mask-image-linear-fade"> {/* Increased height */}
                        {/* Container for the 5 items */}
                        <div className="flex justify-between items-center w-full h-full px-4 sm:px-12"> {/* Adjusted padding for centering */}
                            {visibleClients.map((client, index) => (
                                <div 
                                    key={`${client.id}-${index}`} 
                                    className={`flex flex-col items-center justify-center transition-all duration-700 ease-in-out transform ${isTransitioning ? 'opacity-40 scale-90 blur-[2px]' : 'opacity-100 scale-100 blur-0'}`}
                                    style={{ width: '18%' }}
                                >
                                    {/* UPDATED: Now using Images instead of CSS circles */}
                                    <div className="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center grayscale hover:grayscale-0 opacity-70 hover:opacity-100 transition-all duration-500"> {/* Increased container size */}
                                        <img 
                                            src={client.image} 
                                            alt={client.name}
                                            className="max-w-full max-h-full object-contain drop-shadow-lg"
                                            onError={(e) => {
                                                e.target.style.display = 'none';
                                                e.target.parentElement.innerHTML = '<span style="color:#555; font-size:10px;">Logo</span>';
                                            }}
                                        />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const MenuFloatingShapes = () => {
            const [shapes, setShapes] = useState([]);

            useEffect(() => {
                const newShapes = [];
                // Limited palette as requested: white, black, grey
                const colors = ['text-white', 'text-neutral-500', 'text-neutral-700', 'text-black']; 
                const types = ['circle', 'square', 'triangle', 'x', 'cube', 'pyramid', 'strokeCircle', 'strokeSquare']; 

                for (let i = 0; i < 25; i++) { // Increased count for better coverage
                    newShapes.push({
                        id: i,
                        left: Math.random() * 100,
                        top: Math.random() * 100,
                        size: Math.random() * 20 + 8, // 8-28px size
                        color: colors[Math.floor(Math.random() * colors.length)],
                        type: types[Math.floor(Math.random() * types.length)],
                        opacity: Math.random() * 0.1 + 0.05, // 5% - 15% opacity (Subtle)
                        duration: Math.random() * 40 + 20, // Very slow drift (20-60s)
                        delay: Math.random() * -30, // Negative delay to start mid-animation
                        rot: Math.random() * 360
                    });
                }
                setShapes(newShapes);
            }, []);

            const getShapeSvg = (shape) => {
                const props = { width: "100%", height: "100%", fill: "currentColor", viewBox: "0 0 24 24" };
                const strokeProps = { width: "100%", height: "100%", fill: "none", stroke: "currentColor", strokeWidth: "2", viewBox: "0 0 24 24" };

                switch (shape.type) {
                    case 'circle': return <svg {...props}><circle cx="12" cy="12" r="10" /></svg>;
                    case 'square': return <svg {...props}><rect x="4" y="4" width="16" height="16" /></svg>;
                    case 'triangle': return <svg {...props}><path d="M12 2L2 22H22L12 2Z" /></svg>;
                    case 'x': return <svg {...strokeProps}><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>;
                    case 'strokeCircle': return <svg {...strokeProps}><circle cx="12" cy="12" r="9" /></svg>;
                    case 'strokeSquare': return <svg {...strokeProps}><rect x="4" y="4" width="16" height="16" /></svg>;
                    case 'cube': // Simple 3D Cube Wireframe
                        return (
                            <svg {...strokeProps} strokeWidth="1.5">
                                <path d="M21 16.5L12 21L3 16.5" />
                                <path d="M3 7.5L12 3L21 7.5" />
                                <path d="M12 3V21" />
                                <path d="M3 7.5V16.5" />
                                <path d="M21 7.5V16.5" />
                                <path d="M12 12L21 7.5" />
                                <path d="M12 12L3 7.5" />
                            </svg>
                        );
                    case 'pyramid': // Simple 3D Pyramid
                        return (
                            <svg {...strokeProps} strokeWidth="1.5">
                                <path d="M12 2L2 22H22L12 2Z" />
                                <path d="M12 2L12 22" />
                                <path d="M2 22L12 16L22 22" />
                            </svg>
                        );
                    default: return null;
                }
            };

            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                    <style>{`
                        @keyframes floatWide {
                            0% { transform: translate(0, 0) rotate(0deg); }
                            25% { transform: translate(40px, 15px) rotate(45deg); }
                            50% { transform: translate(10px, 40px) rotate(90deg); }
                            75% { transform: translate(-30px, 10px) rotate(135deg); }
                            100% { transform: translate(0, 0) rotate(180deg); }
                        }
                    `}</style>
                    {shapes.map(shape => (
                        <div
                            key={shape.id}
                            className={`absolute ${shape.color}`}
                            style={{
                                left: `${shape.left}%`,
                                top: `${shape.top}%`,
                                width: `${shape.size}px`,
                                height: `${shape.size}px`,
                                opacity: shape.opacity,
                                transform: `rotate(${shape.rot}deg)`,
                                animation: `floatWide ${shape.duration}s infinite linear`,
                                animationDelay: `${shape.delay}s`,
                                filter: 'blur(0.5px)' // Tiny blur for depth
                            }}
                        >
                            {getShapeSvg(shape)}
                        </div>
                    ))}
                </div>
            );
        };

        const CustomCursor = () => {
            const cursorRef = useRef(null);
            const mouseRef = useRef({ x: -100, y: -100 });
            const posRef = useRef({ x: -100, y: -100 }); 
            // Removed sticky refs
            
            const [isClicking, setIsClicking] = useState(false);
            const [isInverted, setIsInverted] = useState(false);
            const [isVisible, setIsVisible] = useState(false);
            // Removed isSticky state

            useEffect(() => {
                const onMouseMove = (e) => { 
                    mouseRef.current = { x: e.clientX, y: e.clientY }; 
                    setIsVisible(true);
                };
                // Removed mouseover sticky logic

                const onMouseLeave = () => setIsVisible(false);
                const onMouseEnter = () => setIsVisible(true);
                const onMouseDown = () => setIsClicking(true);
                const onMouseUp = () => setIsClicking(false);
                const onClick = () => setIsInverted(prev => !prev);
                
                const lerp = (a, b, n) => (1 - n) * a + n * b;

                let animationFrameId;
                const animate = () => {
                    if (cursorRef.current) {
                        let targetX = mouseRef.current.x;
                        let targetY = mouseRef.current.y;
                        let speed = 0.5; 

                        // REMOVED MAGNETIC LOGIC

                        posRef.current.x = lerp(posRef.current.x, targetX, speed);
                        posRef.current.y = lerp(posRef.current.y, targetY, speed);

                        cursorRef.current.style.transform = `translate3d(${posRef.current.x}px, ${posRef.current.y}px, 0)`;
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };

                window.addEventListener('mousemove', onMouseMove);
                // Removed mouseover listener
                document.addEventListener('mouseleave', onMouseLeave);
                document.addEventListener('mouseenter', onMouseEnter);
                window.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mouseup', onMouseUp);
                window.addEventListener('click', onClick);
                animationFrameId = requestAnimationFrame(animate);

                return () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    // Removed mouseover listener
                    document.removeEventListener('mouseleave', onMouseLeave);
                    document.removeEventListener('mouseenter', onMouseEnter);
                    window.removeEventListener('mousedown', onMouseDown);
                    window.removeEventListener('mouseup', onMouseUp);
                    window.removeEventListener('click', onClick);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            const colors = isInverted ? {
                base: '#4ade80', stripe: '#171717', band: '#fb923c', border: '#ffffff', glowStart: '#ffffff', glowMid: '#4ade80', glowEnd: '#22c55e'
            } : {
                base: '#C084FC', stripe: 'white', band: '#60A5FA', border: '#171717', glowStart: '#FFFFFF', glowMid: '#d8b4fe', glowEnd: '#a855f7'
            };

            const scale = isClicking ? 0.85 : 1;
            
            return (
                <div ref={cursorRef} className="fixed top-0 left-0 pointer-events-none z-[9999]" 
                     style={{ 
                         marginTop: '-16.8px', 
                         marginLeft: '-16.8px', 
                         willChange: 'transform', 
                         opacity: isVisible ? 1 : 0, 
                         transition: 'opacity 0.3s ease' 
                     }}>
                    <svg width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" 
                         style={{ 
                             transform: `scale(${scale})`, 
                             filter: `drop-shadow(0 0 5px rgba(0,0,0,0.5))`, 
                             transition: 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.2s ease-out' 
                         }}>
                        <defs>
                            <path id="arrowShape" d="M20 20 L80 50 L55 60 L45 85 L20 20Z" />
                            <radialGradient id="glowGradient" cx="0.5" cy="0.5" r="0.5">
                                <stop offset="0%" stopColor={colors.glowStart} stopOpacity="0.9" />
                                <stop offset="60%" stopColor={colors.glowEnd} stopOpacity="0.4" />
                                <stop offset="100%" stopColor={colors.glowEnd} stopOpacity="0" />
                            </radialGradient>
                            <clipPath id="arrowClip"><use href="#arrowShape" /></clipPath>
                        </defs>
                        <g clipPath="url(#arrowClip)">
                            <rect x="0" y="0" width="100" height="100" fill={colors.base} style={{ transition: "fill 0.3s ease" }} />
                            <path d="M0 60 L100 20 L100 35 L0 75Z" fill={colors.stripe} style={{ transition: "fill 0.3s ease" }} />
                            <path d="M0 50 L100 10 L100 25 L0 65Z" fill={colors.band} style={{ transition: "fill 0.3s ease" }} />
                            <path d="M0 40 L100 0 L100 15 L0 55Z" fill={colors.stripe} style={{ transition: "fill 0.3s ease" }} />
                            <circle cx="50" cy="50" r="40" fill="url(#glowGradient)" style={{ transformOrigin: '50px 50px', animation: isClicking ? 'none' : 'internalPulse 2s infinite ease-in-out', opacity: (isClicking) ? 1 : undefined }} />
                        </g>
                        <use href="#arrowShape" stroke={colors.border} strokeWidth="6" strokeLinejoin="round" strokeLinecap="round" fill="none" style={{ transition: 'stroke 0.3s ease' }} />
                    </svg>
                </div>
            );
        };

        const BeamEffect = ({ onComplete }) => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let startTime = Date.now();
                const duration = 1000;
                
                canvas.width = Math.max(100, window.innerWidth);
                canvas.height = Math.max(100, window.innerHeight);

                class Spark {
                    constructor() {
                        this.x = Math.random() * canvas.width; this.y = Math.random() * 60; this.angle = Math.random() * Math.PI * 2;
                        this.size = Math.random() * 3 + 1; this.opacity = 1; this.decay = Math.random() * 0.05 + 0.02;
                        this.vx = (Math.random() - 0.5) * 5; this.vy = Math.random() * 15 + 5;
                        
                        // NEW: Assign a random color from the Rainbow Palette to each spark
                        const colors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#22d3ee', '#60a5fa', '#a78bfa', '#e879f9'];
                        this.color = colors[Math.floor(Math.random() * colors.length)];
                    }
                    update() { this.x += this.vx; this.y += this.vy; this.opacity -= this.decay; this.size *= 0.95; }
                    draw() { 
                        ctx.fillStyle = this.color; 
                        ctx.globalAlpha = this.opacity; // Use globalAlpha for cleaner fading
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); 
                        ctx.globalAlpha = 1.0; // Reset
                    }
                }
                const sparks = [];
                for(let i=0; i<50; i++) sparks.push(new Spark());

                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    if (progress >= 1) { onComplete(); return; }
                    
                    // Clear canvas
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // --- DRAW RAINBOW BEAM ---
                    let beamOpacity = progress < 0.2 ? progress * 5 : 1 - ((progress - 0.2) * 1.25);
                    beamOpacity = Math.max(0, beamOpacity);
                    const spreadHeight = canvas.height * (progress < 0.3 ? progress * 3.33 : 1);

                    // 1. Draw the Horizontal Rainbow Gradient across the full width
                    const rainbowGradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
                    rainbowGradient.addColorStop(0, '#f43f5e');
                    rainbowGradient.addColorStop(0.14, '#fb923c');
                    rainbowGradient.addColorStop(0.28, '#facc15');
                    rainbowGradient.addColorStop(0.42, '#4ade80');
                    rainbowGradient.addColorStop(0.57, '#22d3ee');
                    rainbowGradient.addColorStop(0.71, '#60a5fa');
                    rainbowGradient.addColorStop(0.85, '#a78bfa');
                    rainbowGradient.addColorStop(1, '#e879f9');
                    
                    // Create a temporary canvas or use composite operations to mask the rainbow vertically
                    // We want the rainbow color, but faded out vertically like the beam
                    
                    ctx.save();
                    ctx.globalAlpha = beamOpacity * 0.5; // Overall beam opacity
                    ctx.fillStyle = rainbowGradient;
                    
                    // Draw the rainbow fill
                    ctx.fillRect(0, 0, canvas.width, spreadHeight);
                    
                    // Use destination-in to mask it vertically (Fade out at bottom)
                    ctx.globalCompositeOperation = 'destination-in';
                    const maskGradient = ctx.createLinearGradient(0, 0, 0, spreadHeight);
                    maskGradient.addColorStop(0, 'rgba(0,0,0,1)');   // Fully visible at top
                    maskGradient.addColorStop(0.8, 'rgba(0,0,0,0.5)'); 
                    maskGradient.addColorStop(1, 'rgba(0,0,0,0)');   // Transparent at bottom
                    
                    ctx.fillStyle = maskGradient;
                    ctx.fillRect(0, 0, canvas.width, spreadHeight);
                    
                    ctx.restore(); // Restore normal drawing mode
                    
                    // --- DRAW SPARKS ---
                    if (progress < 0.6) for(let i=0; i<5; i++) sparks.push(new Spark());
                    for (let i = sparks.length - 1; i >= 0; i--) { 
                        const spark = sparks[i]; 
                        spark.update(); 
                        spark.draw(); 
                        if (spark.opacity <= 0) sparks.splice(i, 1); 
                    }
                    
                    animationFrameId = requestAnimationFrame(animate);
                };
                animate();
                return () => cancelAnimationFrame(animationFrameId);
            }, [onComplete]);
            return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-[60] mix-blend-screen" />;
        };

        const StarBackground = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let width = window.innerWidth, height = window.innerHeight;
                
                class Star {
                    constructor() { this.reset(); }
                    reset() { this.x = Math.random() * width; this.y = Math.random() * height; this.size = Math.random() * 1.5; this.speedX = (Math.random() - 0.5) * 0.2; this.speedY = (Math.random() - 0.5) * 0.2; this.opacity = Math.random() * 0.5 + 0.1; this.twinkleSpeed = Math.random() * 0.02 + 0.005; }
                    update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0) this.x = width; if (this.x > width) this.x = 0; if (this.y < 0) this.y = height; if (this.y > height) this.y = 0; this.opacity += Math.sin(Date.now() * this.twinkleSpeed) * 0.005; this.opacity = Math.max(0.1, Math.min(0.8, this.opacity)); }
                    draw() { ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                class ShootingStar {
                    constructor() { this.reset(); }
                    reset() { this.x = Math.random() * width; this.y = Math.random() * height * 0.5; this.length = Math.random() * 80 + 20; this.speed = Math.random() * 10 + 5; this.angle = Math.PI / 4; this.active = false; this.timer = Math.random() * 200; }
                    update() { if (!this.active) { this.timer--; if (this.timer <= 0) { this.active = true; this.x = Math.random() * width; this.y = -50; this.timer = Math.random() * 300 + 100; } } else { this.x += this.speed * Math.cos(this.angle); this.y += this.speed * Math.sin(this.angle); if (this.x > width + 100 || this.y > height + 100) this.active = false; } }
                    draw() { if (!this.active) return; const tailX = this.x - this.length * Math.cos(this.angle); const tailY = this.y - this.length * Math.sin(this.angle); const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY); gradient.addColorStop(0, 'rgba(255, 255, 255, 1)'); gradient.addColorStop(1, 'rgba(255, 255, 255, 0)'); ctx.strokeStyle = gradient; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(tailX, tailY); ctx.stroke(); }
                }
                class TextStar {
                    constructor(tx, ty) { this.tx = tx; this.ty = ty; this.x = Math.random() * width; this.y = Math.random() * height; this.size = Math.random() * 1.2; this.opacity = Math.random() * 0.15 + 0.05; }
                    update() { this.x += (this.tx - this.x) * 0.05; this.y += (this.ty - this.y) * 0.05; const time = Date.now() * 0.001; this.driftX = Math.sin(time + this.ty) * 2; this.driftY = Math.cos(time + this.tx) * 2; }
                    draw() { ctx.fillStyle = `rgba(168, 85, 247, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x + this.driftX, this.y + this.driftY, this.size, 0, Math.PI * 2); ctx.fill(); }
                }

                const stars = [], shootingStars = []; let textStars = [];
                const initStars = () => { stars.length = 0; shootingStars.length = 0; for (let i = 0; i < 150; i++) stars.push(new Star()); for (let i = 0; i < 2; i++) shootingStars.push(new ShootingStar()); };
                
                const initTextStars = () => {
                    if (width <= 0 || height <= 0) return;
                    textStars = []; 
                    const offCanvas = document.createElement('canvas'); 
                    const offCtx = offCanvas.getContext('2d');
                    offCanvas.width = width; 
                    offCanvas.height = height;
                    const fontSize = Math.min(width, height) * 0.15;
                    offCtx.font = `900 ${fontSize}px sans-serif`; 
                    offCtx.fillStyle = 'white'; 
                    offCtx.textAlign = 'center'; 
                    offCtx.textBaseline = 'middle';
                    offCtx.fillText('TheDRU', width / 2, height / 2);
                    
                    try {
                        const data = offCtx.getImageData(0, 0, width, height).data;
                        const step = 8;
                        for (let y = 0; y < height; y += step) { 
                            for (let x = 0; x < width; x += step) { 
                                if (data[(y * width + x) * 4 + 3] > 128 && Math.random() > 0.6) {
                                    textStars.push(new TextStar(x, y));
                                }
                            } 
                        }
                    } catch (e) { }
                };

                const drawConstellations = () => {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)'; ctx.lineWidth = 0.5;
                    for (let i = 0; i < stars.length; i++) { for (let j = i + 1; j < stars.length; j++) { const dx = stars[i].x - stars[j].x; const dy = stars[i].y - stars[j].y; if (Math.sqrt(dx * dx + dy * dy) < 100) { ctx.beginPath(); ctx.moveTo(stars[i].x, stars[i].y); ctx.lineTo(stars[j].x, stars[j].y); ctx.stroke(); } } }
                };

                const animate = () => {
                    if (width > 0 && height > 0) {
                        ctx.clearRect(0, 0, width, height);
                        drawConstellations();
                        [...stars, ...textStars, ...shootingStars].forEach(s => { s.update(); s.draw(); });
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };

                const resize = () => { 
                    width = window.innerWidth; 
                    height = window.innerHeight; 
                    if (width > 0 && height > 0) {
                        canvas.width = width; 
                        canvas.height = height; 
                        initStars(); 
                        initTextStars(); 
                    }
                };

                resize(); 
                window.addEventListener('resize', resize); 
                animate();
                return () => { 
                    window.removeEventListener('resize', resize); 
                    cancelAnimationFrame(animationFrameId); 
                };
            }, []);
            return <canvas ref={canvasRef} className="fixed inset-0 w-full h-full pointer-events-none z-0" />;
        };

                            </p>

                            {/* CATEGORY FILTER TABS */}
                            <div className="mt-8 flex justify-center gap-4 flex-wrap">
                                {categories.map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => setFilter(cat)}
                                        className={`btn-menu-silver group relative transition-all duration-300 ${filter === cat ? 'scale-110 border-white/40' : 'opacity-70 hover:opacity-100'}`}
                                    >
                                        <span className={`relative z-10 font-bold text-sm px-6 py-2 block ${filter === cat ? 'text-white' : 'text-neutral-400 group-hover:text-white'}`}>
                                            {cat}
                                        </span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
                            {filteredItems.map((item) => (
                                <div 
                                    key={item.id} 
                                    className="group relative bg-black/40 backdrop-blur-xl border border-white/10 rounded-2xl overflow-hidden hover:border-purple-500/50 transition-all duration-500 hover:shadow-[0_0_40px_-10px_rgba(168,85,247,0.3)] hover:-translate-y-2"
                                >
                                    {/* Image Container with Zoom Effect */}
                                    <div className="aspect-w-16 aspect-h-9 bg-neutral-900 overflow-hidden relative">
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent z-10 opacity-60 group-hover:opacity-40 transition-opacity duration-500"></div>
                                        <img 
                                            src={item.image} 
                                            alt={item.title} 
                                            className="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700 ease-out" 
                                            onError={handleSmartImageError}
                                        />
                                        
                                        {/* Floating Category Badge */}
                                        <div className="absolute top-4 left-4 z-20">
                                            <span className="inline-block px-3 py-1 bg-black/60 backdrop-blur-md border border-white/10 text-purple-300 text-xs font-bold rounded-full uppercase tracking-wider">
                                                {item.category}
                                            </span>
                                        </div>
                                    </div>

                                    {/* Content Area */}
                                    <div className="p-8 relative z-20">
                                        <h3 className="text-2xl font-bold text-white mb-3 hover-pulse-text group-hover:text-purple-200 transition-colors">
                                            {item.title}
                                        </h3>
                                        <p className="text-neutral-400 mb-6 leading-relaxed">
                                            {item.description}
                                        </p>
                                        
                                        <button 
                                            onClick={() => handleRevealVision(item)}
                                            className="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-white/5 hover:bg-purple-500/20 text-white/80 hover:text-white font-medium transition-all duration-300 border border-white/10 hover:border-purple-500/50 group/btn"
                                        >
                                            <Sparkles size={16} className="text-purple-400 group-hover/btn:animate-pulse" />
                                            <span>Reveal Artistic Vision</span>
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const ShopSection = () => (
                <div className="py-12 px-4 sm:px-6 lg:px-8 min-h-screen relative z-10">
                    <div className="max-w-7xl mx-auto"><div className="text-center mb-12"><h2 className="text-base text-purple-400 font-semibold tracking-wide uppercase hover-pulse-text">Store</h2><p className="mt-2 text-3xl leading-8 font-extrabold tracking-tight text-white sm:text-4xl drop-shadow-lg hover-pulse-text">Direct from Creator</p><p className="mt-4 max-w-2xl text-xl text-neutral-400 mx-auto">Interested in a product? Click 'Buy on Instagram' to DM me directly.</p></div>
                    
                    {/* NEW: Golden Note Box */}
                    <div className="max-w-3xl mx-auto mb-12 group">
                        {/* Updated: Uniform centered glow (high quality), consistent border visibility */}
                        <div className="relative p-[1px] rounded-xl bg-gradient-to-r from-yellow-600/30 via-yellow-200/80 to-yellow-600/30 
                                      shadow-[0_0_35px_-5px_rgba(250,204,21,0.3)] 
                                      hover:shadow-[0_0_60px_-10px_rgba(250,204,21,0.6)] 
                                      transform hover:scale-105 transition-all duration-500 ease-out">
                            
                            <div className="bg-black/90 backdrop-blur-xl rounded-xl py-4 px-6 text-center relative overflow-hidden">
                                {/* Inner glow for depth */}
                                <div className="absolute inset-0 shadow-[inset_0_0_20px_rgba(250,204,21,0.1)] rounded-xl"></div>
                                
                                {/* Subtle gold sheen animation */}
                                <div className="absolute inset-0 bg-gradient-to-r from-transparent via-yellow-100/10 to-transparent translate-x-[-100%] animate-[shimmer_3s_infinite]"></div>
                                
                                <p className="text-yellow-100 font-medium tracking-widest text-xs sm:text-sm relative z-10 drop-shadow-[0_0_8px_rgba(250,204,21,0.5)]">
                                    QUALITY REMAINS SAME FOR ALL PACK , I JUST GIVE LESS WORKTIME AS PER PACK 😊
                                </p>
                            </div>
                        </div>
                        {/* Define animation style inline for the sheen */}
                        <style>{`
                            @keyframes shimmer {
                                100% { transform: translateX(100%); }
                            }
                        `}</style>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        {PRODUCTS.map((product) => {
                            const isPremium = product.name === "PREMIUM";
                            const isGold = product.name === "GOLD";
                            const isBronze = product.name === "STONE"; // Bronze style for Stone
                            const isSpecial = isPremium || isGold || isBronze;
                            
                            // Define Styles based on Tier
                            // UPDATED: Reduced hover shadow intensity for standard cards
                            let containerClass = "bg-neutral-900/80 backdrop-blur-md border border-neutral-800 rounded-2xl shadow-sm hover:shadow-lg hover:shadow-purple-900/10 hover:border-neutral-600 transition-all duration-300 overflow-hidden flex flex-col h-full";
                            let shimmerClass = "";
                            let tagClass = "bg-black/90 text-white border-neutral-800";
                            let textClass = "text-white";
                            let priceClass = "text-white";
                            let btnClass = "bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:from-purple-700 hover:to-pink-700 shadow-purple-900/20";
                            let conceptBtnClass = "bg-neutral-800 text-purple-300 border-purple-500/30 hover:bg-neutral-700 hover:text-white";

                            if (isPremium) {
                                // UPDATED: Significantly reduced shadow opacity and spread for "very less" glow
                                containerClass = "relative p-[1px] rounded-2xl bg-gradient-to-r from-zinc-600/30 via-white/80 to-zinc-600/30 shadow-[0_0_15px_-5px_rgba(255,255,255,0.05)] hover:shadow-[0_0_20px_-5px_rgba(255,255,255,0.15)] transition-all duration-300 hover:scale-[1.02] flex flex-col h-full group";
                                // UPDATED: Reduced opacity for subtler shine (via-white/10 instead of /20)
                                shimmerClass = "via-white/10";
                                tagClass = "bg-white/20 text-white border-white/30";
                                textClass = "text-white drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]";
                                priceClass = "text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]";
                                btnClass = "bg-gradient-to-r from-slate-300 to-white text-black hover:from-white hover:to-slate-200 shadow-white/20";
                            } else if (isGold) {
                                // UPDATED: Significantly reduced shadow opacity and spread
                                containerClass = "relative p-[1px] rounded-2xl bg-gradient-to-r from-yellow-700/30 via-yellow-300/80 to-yellow-700/30 shadow-[0_0_15px_-5px_rgba(250,204,21,0.05)] hover:shadow-[0_0_20px_-5px_rgba(250,204,21,0.15)] transition-all duration-300 hover:scale-[1.02] flex flex-col h-full group";
                                // UPDATED: Reduced opacity for subtler shine (via-yellow-300/10 instead of /20)
                                shimmerClass = "via-yellow-300/10";
                                tagClass = "bg-yellow-500/20 text-yellow-200 border-yellow-500/30";
                                textClass = "text-yellow-100 drop-shadow-[0_0_5px_rgba(250,204,21,0.5)]";
                                priceClass = "text-yellow-100 drop-shadow-[0_0_8px_rgba(250,204,21,0.3)]";
                                btnClass = "bg-gradient-to-r from-yellow-600 to-yellow-300 text-black hover:from-yellow-300 hover:to-yellow-500 shadow-yellow-500/20";
                                conceptBtnClass = "bg-neutral-900 text-yellow-300 border-yellow-500/30 hover:bg-neutral-800 hover:text-white";
                            } else if (isBronze) {
                                // UPDATED: Significantly reduced shadow opacity and spread
                                containerClass = "relative p-[1px] rounded-2xl bg-gradient-to-r from-orange-800/30 via-orange-400/80 to-orange-800/30 shadow-[0_0_15px_-5px_rgba(249,115,22,0.05)] hover:shadow-[0_0_20px_-5px_rgba(249,115,22,0.15)] transition-all duration-300 hover:scale-[1.02] flex flex-col h-full group";
                                // UPDATED: Reduced opacity for subtler shine (via-orange-400/10 instead of /20)
                                shimmerClass = "via-orange-400/10";
                                tagClass = "bg-orange-600/20 text-orange-200 border-orange-500/30";
                                textClass = "text-orange-100 drop-shadow-[0_0_5px_rgba(249,115,22,0.5)]";
                                priceClass = "text-orange-100 drop-shadow-[0_0_8px_rgba(249,115,22,0.3)]";
                                btnClass = "bg-gradient-to-r from-orange-700 to-orange-400 text-white hover:from-orange-500 hover:to-orange-700 shadow-orange-500/20";
                            }
                            
                            return (
                                <div key={product.id} className={containerClass}>
                                    {/* Inner Container wrapper */}
                                    <div className={isSpecial ? "bg-neutral-900/90 w-full h-full rounded-2xl flex flex-col relative overflow-hidden" : "contents"}>
                                        
                                        {/* Shimmer Animation for Special Cards */}
                                        {/* UPDATED: Changed animation to 'cardShimmer_12s_infinite' and added 'group-hover:' prefix */}
                                        {isSpecial && (
                                            <div className={`absolute inset-0 bg-gradient-to-r from-transparent ${shimmerClass} to-transparent translate-x-[-100%] group-hover:animate-[cardShimmer_12s_infinite] pointer-events-none z-20`}></div>
                                        )}

                                        <div className="relative">
                                            <img 
                                                src={product.image} 
                                                alt={product.name} 
                                                className="w-full h-64 object-cover" 
                                                onError={handleSmartImageError}
                                            />
                                            <div className={`absolute top-4 right-4 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold shadow-sm border ${tagClass}`}>
                                                {product.tag}
                                            </div>
                                        </div>
                                        
                                        {/* Content Section */}
                                        <div className="p-6 flex-1 flex flex-col relative z-10">
                                            <h3 className={`text-lg font-bold hover-pulse-text ${textClass}`}>
                                                {product.name}
                                            </h3>
                                            <div className="mt-4 flex items-baseline">
                                                <span className={`text-xl font-extrabold hover-pulse-text ${priceClass}`}>
                                                    {product.price}
                                                </span>
                                            </div>
                                            
                                            {/* GEMINI INTEGRATION FOR CUSTOM LOGO PRODUCT (Linked to 'GOLD' - ID 2) */}
                                            {product.id === 2 && (
                                                <button 
                                                    onClick={() => {
                                                        setSelectedProductForConcept(product.name);
                                                        setConceptModalOpen(true);
                                                    }}
                                                    className={`mt-4 w-full flex items-center justify-center gap-2 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-colors border ${conceptBtnClass}`}
                                                >
                                                    <Sparkles size={14} />
                                                    <span>✨ Generate Concepts</span>
                                                </button>
                                            )}

                                            <div className="mt-auto pt-6">
                                                <button 
                                                    onClick={() => {
                                                        // Auto-copy text
                                                        const text = `I'm interested in the ${product.name} package`;
                                                        const textArea = document.createElement("textarea");
                                                        textArea.value = text;
                                                        textArea.style.position = "fixed";
                                                        textArea.style.left = "-9999px";
                                                        textArea.style.top = "0";
                                                        document.body.appendChild(textArea);
                                                        textArea.focus();
                                                        textArea.select();
                                                        
                                                        try {
                                                            document.execCommand('copy');
                                                            console.log("Text copied via execCommand");
                                                        } catch (err) {
                                                            console.error("Copy failed", err);
                                                        }
                                                        document.body.removeChild(textArea);
                                                        
                                                        window.open(`https://ig.me/m/${INSTAGRAM_HANDLE}`, '_blank');
                                                    }} 
                                                    className={`w-full flex items-center justify-center gap-2 font-medium py-3 px-4 rounded-xl transition-all shadow-lg transform active:scale-95 ${btnClass}`}
                                                >
                                                    <Instagram size={20} />
                                                    <span>Buy on Instagram</span>
                                                </button>
                                                <p className="text-xs text-center text-neutral-500 mt-2">Msg copied to clipboard</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div></div> // Ensure correct number of closing divs
            );

            const ClientCarousel = () => {
                const [clients, setClients] = useState(CLIENTS_DATA);
                const [isTransitioning, setIsTransitioning] = useState(false);

                useEffect(() => {
                    const interval = setInterval(() => {
                        setIsTransitioning(true);
                        setTimeout(() => {
                            setClients(prev => {
                                const newArr = [...prev];
                                const first = newArr.shift(); // Remove first
                                newArr.push(first); // Add to end
                                return newArr;
                            });
                            setIsTransitioning(false);
                        }, 600); // Slower transition duration for smoothness
                    }, 3000); // Hold for 3 seconds before rotating

                    return () => clearInterval(interval);
                }, []);

                // UPDATED: Show 5 clients
                const visibleClients = clients.slice(0, 5);

                return (
                    <div className="w-full max-w-4xl mt-16 mx-auto">
                         <p className="text-sm font-bold text-neutral-500 uppercase tracking-[0.2em] mb-10 text-center hover-pulse-text">
                            Trusted By <span className="opacity-40 normal-case tracking-normal ml-2 text-[0.8em]">(and many more)</span>
                        </p>
                        <div className="relative overflow-hidden h-24 mask-image-linear-fade">
                            {/* Container for the 5 items */}
                            <div className="flex justify-between items-center w-full h-full px-4 sm:px-12">
                                {visibleClients.map((client, index) => (
                                    <div 
                                        key={`${client.id}-${index}`} 
                                        className={`flex flex-col items-center justify-center transition-all duration-700 ease-in-out transform ${isTransitioning ? 'opacity-40 scale-90 blur-[2px]' : 'opacity-100 scale-100 blur-0'}`}
                                        style={{ width: '18%' }}
                                    >
                                        <div className="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center grayscale hover:grayscale-0 opacity-70 hover:opacity-100 transition-all duration-500">
                                            <img 
                                                src={client.image} 
                                                alt={client.name}
                                                className="max-w-full max-h-full object-contain drop-shadow-lg"
                                                data-type="client-logo"
                                                onError={handleSmartImageError}
                                            />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            const ContactSection = () => {
                const [message, setMessage] = useState('');
                const [drafting, setDrafting] = useState(false);
                
                const handleDraft = async () => { 
                    if (!message.trim()) return; 
                    setDrafting(true); 
                    const result = await callGemini(`Rewrite this draft message to be more professional, engaging, and clear for a client inquiry to a designer: "${message}"`); 
                    setMessage(result); 
                    setDrafting(false); 
                };
                
                return (
                    <div className="py-16 px-4 sm:px-6 lg:px-8 relative z-10"><div className="max-w-3xl mx-auto"><div className="text-center mb-10"><h2 className="text-3xl font-extrabold text-white sm:text-4xl drop-shadow-lg hover-pulse-text">Let's Connect</h2><p className="mt-4 text-lg text-neutral-400">Draft your idea below and let AI polish it before sending.</p></div><div className="bg-neutral-900/90 backdrop-blur-md p-8 rounded-2xl border border-neutral-800 shadow-xl"><div className="mb-6"><label className="block text-sm font-medium text-neutral-300 mb-2">Your Inquiry</label><textarea rows={4} className="w-full bg-black/50 border border-neutral-700 rounded-lg p-4 text-white focus:ring-2 focus:ring-purple-500" placeholder="e.g. I need a logo for my bakery..." value={message} onChange={(e) => setMessage(e.target.value)} /><div className="mt-2 flex justify-end"><button onClick={handleDraft} disabled={drafting || !message.trim()} className="flex items-center gap-2 text-xs font-bold text-purple-400 hover:text-purple-300 disabled:opacity-50 uppercase tracking-wide">{drafting ? <Loader size={12} className="animate-spin" /> : <Sparkles size={12} />}{drafting ? 'Polishing...' : 'Polish with AI'}</button></div></div><div className="flex flex-col sm:flex-row gap-4"><a href={INSTAGRAM_URL} target="_blank" rel="noopener noreferrer" className="flex-1 flex items-center justify-center px-6 py-4 border border-transparent text-base font-medium rounded-xl text-white bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 transition-all"><Instagram className="mr-2" />DM on Instagram</a><a href={`mailto:contact@example.com?body=${encodeURIComponent(message)}`} className="flex-1 flex items-center justify-center px-6 py-4 border border-neutral-700 text-base font-medium rounded-xl text-neutral-300 bg-neutral-800 hover:bg-neutral-700 transition-all"><Mail className="mr-2" />Send Email</a></div></div></div></div>
                );
            };

            return (
                <div className="min-h-screen bg-black font-sans text-neutral-100 relative cursor-none">
                    <CustomCursor /><StarBackground />{showBeam && <BeamEffect onComplete={() => setShowBeam(false)} />}
                    <AIModal />
                    <ConceptGenModal 
                        isOpen={conceptModalOpen} 
                        onClose={() => setConceptModalOpen(false)} 
                        productTitle={selectedProductForConcept} 
                    />
                    
                    {/* Navigation with Cinematic Glow */}
                    <nav className="bg-black/80 backdrop-blur-md sticky top-0 z-50">
                        {/* The Cinematic Glow Line (Pseudo-element replacement) */}
                        <div className="cinematic-nav-glow"></div>
                        
                        <MenuFloatingShapes />

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center">
                                    <span 
                                        className="text-2xl font-bold cursor-pointer cinematic-text-gradient" 
                                        onClick={() => navigateTo('home')}
                                    >
                                        TheDRU
                                    </span>
                                    {/* UPDATED: Increased logo size from w-10 to w-16 to fit perfectly */}
                                    <img 
                                        src="1.png" 
                                        alt="Logo" 
                                        className="w-16 h-16 ml-3 object-contain hover:scale-110 transition-transform duration-300" 
                                        onError={handleSmartImageError}
                                    />
                                </div>
                                
                                <div className="hidden md:flex items-center space-x-8">
                                    {['home', 'portfolio', 'shop', 'contact'].map((item) => (
                                        <button 
                                            key={item}
                                            onClick={() => navigateTo(item)} 
                                            className={`btn-menu-silver group relative ${activeSection === item ? 'opacity-100' : 'opacity-80 hover:opacity-100'}`}
                                            style={{ transform: 'scale(0.85)' }}
                                        >
                                            <span className="relative z-10 font-bold text-sm text-white capitalize px-5 py-2 block">
                                                {item}
                                            </span>
                                        </button>
                                    ))}
                                </div>

                                <div className="flex items-center md:hidden">
                                    <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="inline-flex items-center justify-center p-2 rounded-md text-neutral-400 hover:text-white hover:bg-neutral-900 focus:outline-none">
                                        {isMenuOpen ? <XIcon size={24} /> : <MenuIcon size={24} />}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>
                    {isMenuOpen && (<div className="md:hidden bg-black/95 border-t border-neutral-800"><div className="pt-2 pb-3 space-y-1 px-4"><button onClick={() => navigateTo('home')} className="block w-full text-left px-3 py-2 text-base font-medium text-neutral-300 hover:text-white hover:bg-neutral-900 rounded-md">Home</button><button onClick={() => navigateTo('portfolio')} className="block w-full text-left px-3 py-2 text-base font-medium text-neutral-300 hover:text-white hover:bg-neutral-900 rounded-md">Portfolio</button><button onClick={() => navigateTo('shop')} className="block w-full text-left px-3 py-2 text-base font-medium text-neutral-300 hover:text-white hover:bg-neutral-900 rounded-md">Shop</button><button onClick={() => navigateTo('contact')} className="block w-full text-left px-3 py-2 text-base font-medium text-indigo-400 hover:bg-neutral-900 rounded-md">Contact</button></div></div>)}
                    <main className="relative z-10">{activeSection === 'home' && <><Hero /><PortfolioSection /><div className="py-8 text-center border-t border-neutral-900/50 relative z-10"><button onClick={() => navigateTo('shop')} className="inline-flex items-center text-indigo-400 font-semibold hover:text-indigo-300 hover-pulse-text">View All Products <ArrowRight size={16} className="ml-2" /></button></div></>}{activeSection === 'portfolio' && <PortfolioSection />}{activeSection === 'shop' && <ShopSection />}{activeSection === 'contact' && <ContactSection />}</main>
                    <footer className="bg-black/80 backdrop-blur-md text-white py-12 border-t border-neutral-900 relative z-10"><div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div className="flex flex-col md:flex-row justify-between items-center"><div className="mb-4 md:mb-0"><span className="text-xl font-bold text-neutral-200 hover-pulse-text">TheDRU</span><p className="text-neutral-500 text-sm mt-1">© 2024 All rights reserved.</p></div><div className="flex space-x-6"><a href={INSTAGRAM_URL} target="_blank" rel="noopener noreferrer" className="text-neutral-400 hover:text-white transition-colors"><Instagram size={24} /></a><a href="mailto:contact@example.com" className="text-neutral-400 hover:text-white transition-colors"><Mail size={24} /></a></div></div></div></footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
